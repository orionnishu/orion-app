<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" font-family="'Courier New', monospace" font-size="13">

  <!-- Background -->
  <rect width="820" height="480" fill="white"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">ESP32 PC Power Button Circuit — 2N2222 NPN Switch</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- MOBO HEADER BLOCK (left)                   -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="20" y="120" width="170" height="140" rx="6" fill="#e8f0fe" stroke="#3c78d8" stroke-width="2"/>
  <text x="105" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56db">F_PANEL Header</text>
  <text x="105" y="166" text-anchor="middle" font-size="11" fill="#444">(Motherboard)</text>

  <!-- Pin 1: PWR_SIGNAL at y=195 -->
  <circle cx="190" cy="195" r="4" fill="#3c78d8"/>
  <line x1="190" y1="195" x2="160" y2="195" stroke="#3c78d8" stroke-width="2"/>
  <text x="100" y="199" text-anchor="middle" font-size="11" fill="#1a56db">PWR_SIGNAL</text>

  <!-- Pin 2: PWR_GND at y=240 -->
  <circle cx="190" cy="240" r="4" fill="#3c78d8"/>
  <line x1="190" y1="240" x2="160" y2="240" stroke="#3c78d8" stroke-width="2"/>
  <text x="100" y="244" text-anchor="middle" font-size="11" fill="#1a56db">PWR_GND</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- CABINET BUTTON (parallel, between the two  -->
  <!-- horizontal MOBO wires on the left side)    -->
  <!-- ═══════════════════════════════════════════ -->
  <!-- Drop from PWR_SIGNAL wire down to switch top -->
  <line x1="260" y1="195" x2="260" y2="204" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Bottom contact line -->
  <line x1="250" y1="204" x2="270" y2="204" stroke="#777" stroke-width="2"/>
  <!-- Switch arm (diagonal, open position) -->
  <line x1="250" y1="204" x2="268" y2="222" stroke="#777" stroke-width="2"/>
  <!-- Top contact line (bottom of gap) -->
  <line x1="250" y1="230" x2="270" y2="230" stroke="#777" stroke-width="2"/>
  <!-- Drop from switch bottom to PWR_GND wire -->
  <line x1="260" y1="230" x2="260" y2="240" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Junction dots -->
  <circle cx="260" cy="195" r="3" fill="#999"/>
  <circle cx="260" cy="240" r="3" fill="#999"/>
  <!-- Label -->
  <text x="260" y="85" text-anchor="middle" font-size="11" fill="#555">Cabinet Button</text>
  <text x="260" y="99" text-anchor="middle" font-size="10" fill="#777">(in parallel — original)</text>
  <!-- Arrow from label to switch -->
  <line x1="260" y1="103" x2="260" y2="201" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- 2N2222 NPN TRANSISTOR (center)             -->
  <!-- ═══════════════════════════════════════════ -->
  <!-- Transistor body circle -->
  <circle cx="420" cy="240" r="40" fill="#fff8e8" stroke="#b45309" stroke-width="2"/>
  <text x="420" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Q1 · 2N2222</text>

  <!-- Vertical base line inside circle -->
  <line x1="405" y1="210" x2="405" y2="270" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Collector line (top-right diagonal) -->
  <line x1="405" y1="220" x2="440" y2="195" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Emitter line with arrow (bottom-right diagonal) -->
  <line x1="405" y1="260" x2="440" y2="285" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Emitter arrow head -->
  <polygon points="440,285 428,276 434,290" fill="#1a1a1a"/>

  <!-- Base stub (left) -->
  <line x1="380" y1="240" x2="405" y2="240" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Terminal labels -->
  <text x="450" y="192" font-size="12" font-weight="bold" fill="#1a1a1a">C</text>
  <text x="365" y="244" font-size="12" font-weight="bold" fill="#1a1a1a">B</text>
  <text x="450" y="292" font-size="12" font-weight="bold" fill="#1a1a1a">E</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- WIRE: PWR_SIGNAL → Collector               -->
  <!-- ═══════════════════════════════════════════ -->
  <line x1="190" y1="195" x2="440" y2="195" stroke="#3c78d8" stroke-width="2"/>
  <circle cx="440" cy="195" r="4" fill="#3c78d8"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- WIRE: Emitter → GND rail                   -->
  <!-- ═══════════════════════════════════════════ -->
  <line x1="440" y1="285" x2="440" y2="390" stroke="#888" stroke-width="2"/>
  <!-- GND rail horizontal line -->
  <line x1="220" y1="390" x2="650" y2="390" stroke="#888" stroke-width="2"/>
  <!-- GND symbol at center bottom -->
  <line x1="400" y1="390" x2="400" y2="410" stroke="#444" stroke-width="2"/>
  <line x1="380" y1="410" x2="420" y2="410" stroke="#444" stroke-width="2.5"/>
  <line x1="386" y1="418" x2="414" y2="418" stroke="#444" stroke-width="2"/>
  <line x1="392" y1="426" x2="408" y2="426" stroke="#444" stroke-width="1.5"/>
  <text x="400" y="445" text-anchor="middle" font-size="11" fill="#444">Common GND</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- WIRE: PWR_GND → GND rail                   -->
  <!-- ═══════════════════════════════════════════ -->
  <line x1="190" y1="240" x2="300" y2="240" stroke="#3c78d8" stroke-width="2"/>
  <line x1="300" y1="240" x2="300" y2="390" stroke="#3c78d8" stroke-width="2"/>
  <circle cx="300" cy="390" r="4" fill="#3c78d8"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ESP32 BLOCK (right)                         -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="600" y="175" width="150" height="110" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="675" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e7e34">ESP32</text>

  <!-- GPIO4 pin (upper left of ESP32) -->
  <circle cx="600" cy="220" r="4" fill="#34a853"/>
  <line x1="600" y1="220" x2="630" y2="220" stroke="#34a853" stroke-width="2"/>
  <text x="638" y="224" font-size="12" fill="#1e7e34">GPIO4</text>

  <!-- GND pin (lower left of ESP32) -->
  <circle cx="600" cy="260" r="4" fill="#34a853"/>
  <line x1="600" y1="260" x2="630" y2="260" stroke="#34a853" stroke-width="2"/>
  <text x="638" y="264" font-size="12" fill="#1e7e34">GND</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ESP32 GND → Common GND rail                -->
  <!-- ═══════════════════════════════════════════ -->
  <line x1="600" y1="260" x2="570" y2="260" stroke="#34a853" stroke-width="2"/>
  <line x1="570" y1="260" x2="570" y2="390" stroke="#34a853" stroke-width="2"/>
  <circle cx="570" cy="390" r="4" fill="#34a853"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- R1 (1kΩ): GPIO4 → Base                    -->
  <!-- ═══════════════════════════════════════════ -->
  <line x1="600" y1="220" x2="560" y2="220" stroke="#34a853" stroke-width="2"/>
  <!-- R1 zigzag at x=490–560, y=220 -->
  <polyline points="560,220 554,209 546,231 538,209 530,231 522,209 514,231 506,220 490,220"
            fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="525" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">R1  1kΩ</text>
  <!-- wire from R1 left end (490,220) → down to Base level → Base (380,240) -->
  <line x1="490" y1="220" x2="460" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="460" y1="220" x2="460" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="460" y1="240" x2="380" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Junction dot at Base node -->
  <circle cx="460" cy="240" r="4" fill="#1a1a1a"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- R2 (4.7kΩ): Base → Emitter/GND            -->
  <!-- ═══════════════════════════════════════════ -->
  <line x1="460" y1="240" x2="460" y2="295" stroke="#1a1a1a" stroke-width="2"/>
  <!-- R2 zigzag vertical at x=460, y=295 to y=365 -->
  <polyline points="460,295 449,301 471,309 449,317 471,325 449,333 471,341 460,347 460,365"
            fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="488" y="325" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">R2  4.7kΩ</text>
  <line x1="460" y1="365" x2="460" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="460" cy="390" r="4" fill="#1a1a1a"/>

</svg>
