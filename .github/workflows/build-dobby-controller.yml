name: Build Dobby Controller APK

on:
  push:
    branches: [ "dobby-controller-v1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        working-directory: dobby-controller
        run: gradle assembleDebug
      - name: Verify APK
        run: test -f dobby-controller/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dobby-Controller-APK
          path: dobby-controller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
