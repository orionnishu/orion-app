# ORION Machine Registry
# Each [section] defines a node that orion-node can manage.
# Fields:
#   start_method  — comma-separated list of methods to try (first success wins)
#   stop_method   — comma-separated list of methods to try (first success wins)
#   tailscale_host — hostname for status checks via `tailscale ping`
#
# Method-specific fields:
#   mqtt_host, mqtt_cmd_topic, mqtt_status_topic  — for MQTT/ESP32 relay
#   wol_mac, wol_broadcast                        — for Wake-on-LAN
#   ssh_host, ssh_user, ssh_cmd                   — for SSH remote command
#   oci_instance_id, oci_profile                  — for OCI CLI start/stop
#   oci_region                                    — OCI region (optional, uses profile default)

[desktop-pc]
start_method=mqtt,wol
stop_method=mqtt,ssh
mqtt_host=192.168.0.103
mqtt_cmd_topic=orion/pc/cmd
mqtt_status_topic=orion/pc/status
wol_mac=A0:CE:C8:0A:4A:1D
wol_broadcast=192.168.50.255
ssh_host=orion-desktoppc-wifi
ssh_user=pkaga
ssh_cmd=schtasks /run /tn SleepMyPC
tailscale_host=orion-desktoppc

[cloud2-vm1]
start_method=oci
stop_method=oci
oci_instance_id=ocid1.instance.oc1.uk-london-1.anwgiljtkybzm3qcxzztci5cre3i5ghj7pvbv2hkhvsdks3x4cq45255oi4a
oci_profile=cloud2
tailscale_host=orion-cloud2-vm1

[cloud2-vm2]
start_method=oci
stop_method=oci
oci_instance_id=ocid1.instance.oc1.uk-london-1.anwgiljtkybzm3qcoffksabbrzeb6dvhoyjjeogapcfhddyi4igmhz2wernq
oci_profile=cloud2
tailscale_host=orion-cloud2-vm2

