{% extends "base.html" %}

{% block content %}
<div class="doc-container"
    style="max-width: 900px; margin: 0 auto; padding: 20px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px;">
    <div class="md-content">
        {{ content_html | safe }}
    </div>
</div>

<style>
    .md-content {
        line-height: 1.6;
        color: #333;
    }

    .md-content h1,
    .md-content h2,
    .md-content h3 {
        color: #111;
        border-bottom: 1px solid #eaecef;
        padding-bottom: 0.3em;
    }

    .md-content pre {
        background-color: #f6f8fa;
        border-radius: 6px;
        padding: 16px;
        overflow: auto;
    }

    .md-content code {
        background-color: rgba(27, 31, 35, 0.05);
        border-radius: 3px;
        padding: 0.2em 0.4em;
        font-family: monospace;
    }

    .md-content pre code {
        background-color: transparent;
        padding: 0;
    }

    .md-content table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 16px;
    }

    .md-content th,
    .md-content td {
        border: 1px solid #dfe2e5;
        padding: 6px 13px;
    }

    .md-content tr:nth-child(2n) {
        background-color: #f6f8fa;
    }
</style>
{% endblock %}
